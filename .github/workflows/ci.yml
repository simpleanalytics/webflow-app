name: Webflow app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            data-client/package-lock.json
            designer-extension/package-lock.json
      - run: npm ci --prefix data-client && npm ci --prefix designer-extension
      - run: npm run lint --prefix data-client && npm test --prefix data-client
      - run: npm run lint --prefix designer-extension && npm run build:prod --prefix designer-extension
      - uses: actions/upload-artifact@v4
        with:
          name: webflow-extension
          path: designer-extension/bundle.zip
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: webflow-app:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke checks
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f webflow-smoke-backend webflow-smoke-redis >/dev/null 2>&1; docker network rm webflow-smoke >/dev/null 2>&1' EXIT
          docker network create webflow-smoke
          docker run -d --name webflow-smoke-redis --network webflow-smoke redis:7.4.8 redis-server --appendonly yes
          for attempt in {1..30}; do
            if docker exec webflow-smoke-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          docker run -d --name webflow-smoke-backend --network webflow-smoke --read-only --tmpfs /tmp -p 127.0.0.1:3039:3000 \
            -e REDIS_URL=redis://webflow-smoke-redis:6379 \
            -e WEBFLOW_CLIENT_ID=smoke-test-client \
            -e WEBFLOW_CLIENT_SECRET=smoke-test-secret \
            -e APP_BASE_URL=http://127.0.0.1:3039 \
            -e DESIGNER_EXTENSION_URI=https://smoke-test.webflow-ext.com webflow-app:smoke
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3039/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
          docker stop webflow-smoke-redis
          node scripts/smoke.mjs --unhealthy

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/simpleanalytics/webflow-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    uses: simpleanalytics/github-actions/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      app: webflow_backend
      hosts: esapp04
      strategy: replace
      image_repo: ghcr.io/simpleanalytics/webflow-app
      image_tag: ${{ github.sha }}
